name: 更新笔记索引与 SEO

on:
  push:
    branches: [main, master]
    paths:
      - 'notes/**'
      - '!notes/index.json'
      - 'scripts/**'
      - 'config.js'
      - '.github/workflows/build-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要 git 历史来计算 sitemap 的 lastmod

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 生成 notes/index.json
        run: node scripts/build-index.mjs

      - name: 生成静态文章页、sitemap.xml、robots.txt
        run: |
          npm i --no-save --no-package-lock marked@12
          node scripts/build-seo.mjs
          rm -rf node_modules

      - name: 有变化时提交
        run: |
          git add -A notes/index.json p sitemap.xml robots.txt index.html
          if git diff --cached --quiet; then
            echo "无变化"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 更新索引与 SEO 静态页"
          git push
