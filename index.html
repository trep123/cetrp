<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的笔记</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="目录">☰</button>
    <h1 id="siteTitle"><a href="#">我的笔记</a></h1>
    <div class="actions">
      <span id="modeBadge" class="badge">只读</span>
      <button id="newBtn" class="btn primary auth-only">新建</button>
      <label class="btn auth-only" title="上传 .md 笔记或图片/附件">上传<input id="uploadInput" type="file" multiple hidden></label>
      <button id="settingsBtn" class="btn ghost">设置</button>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar">
      <input id="searchInput" type="search" placeholder="搜索标题或路径…">
      <ul id="noteList"></ul>
      <button id="rebuildBtn" class="btn ghost small auth-only" title="扫描仓库笔记目录，重新生成 index.json">重建索引</button>
    </aside>

    <main id="main">
      <section id="viewer" class="card">
        <div class="note-head">
          <h2 id="noteTitle">欢迎</h2>
          <div id="noteActions" class="note-actions auth-only hidden">
            <button id="editBtn" class="btn small">编辑</button>
            <button id="deleteBtn" class="btn small danger">删除</button>
          </div>
        </div>
        <div id="noteMeta" class="meta"></div>
        <article id="noteBody" class="markdown"></article>
      </section>

      <section id="editor" class="card hidden">
        <div class="path-row">
          <span id="dirPrefix" class="prefix">notes/</span>
          <input id="pathInput" placeholder="文件名，如 linux/命令速查.md">
        </div>
        <div class="editor-tools">
          <label class="btn small">插入图片/附件<input id="attachInput" type="file" multiple hidden></label>
          <button id="previewToggle" class="btn small ghost">预览</button>
          <span class="spacer"></span>
          <button id="cancelBtn" class="btn small ghost">取消</button>
          <button id="saveBtn" class="btn small primary">保存到仓库</button>
        </div>
        <textarea id="contentInput" spellcheck="false" placeholder="# 标题&#10;&#10;用 Markdown 写笔记…"></textarea>
        <article id="previewBody" class="markdown hidden"></article>
      </section>
    </main>
  </div>

  <dialog id="settingsDlg">
    <form method="dialog" id="settingsForm">
      <h3>仓库设置</h3>
      <label>站点标题<input name="title" placeholder="我的笔记"></label>
      <div class="row">
        <label>用户名 / 组织<input name="owner" required></label>
        <label>仓库名<input name="repo" required></label>
      </div>
      <div class="row">
        <label>分支<input name="branch" placeholder="main"></label>
        <label>笔记目录<input name="dir" placeholder="notes"></label>
      </div>
      <label>GitHub Token（留空 = 只读访客模式）
        <input name="token" type="password" autocomplete="off" placeholder="github_pat_…">
      </label>
      <p class="hint">用 Fine-grained token，只授权这个仓库的 <b>Contents: Read and write</b>。Token 只保存在当前浏览器的 localStorage，不会写进仓库。</p>
      <div class="dlg-actions">
        <button type="button" id="logoutBtn" class="btn ghost danger">退出（清除 Token）</button>
        <span class="spacer"></span>
        <button value="cancel" formnovalidate class="btn ghost">取消</button>
        <button id="settingsSave" value="save" class="btn primary">保存</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
