<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#170a33">
<meta name="description" content="七夕主题 · 纯前端 3D 爱心跳动粒子动画（3D 桃花花瓣心形 + 鹊桥相会 + 银河牛郎织女）">
<title>七夕快乐</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%92%96%3C/text%3E%3C/svg%3E">
<!--
  七夕 · 3D 爱心跳动粒子动画（纯前端素材）
  - 零依赖：单个 HTML 文件，双击即可在浏览器打开，离线可用
  - 3D 粒子爱心：参数方程心形 + 透镜剖面立体化 + 透视投影/深度排序，弹簧物理模拟"咚咚"双搏心跳，桃花花瓣（内嵌 base64 PNG）渲染
  - 七夕元素：银河光带 / 牛郎织女星 / 鹊桥喜鹊 / 流星 / 漂浮花瓣
  - 交互：鼠标靠近吸附 + 尾随光尾、拖拽旋转 3D、滚轮缩放、点击散开并生成带字小爱心、面板可调心跳/粒子/自转
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#0b0420; }
  body {
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #sky { position:fixed; inset:0; display:block; cursor:crosshair; z-index:0; }
  .vignette {
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(8,2,18,.6) 100%);
  }
  .overlay { position:fixed; inset:0; pointer-events:none; z-index:3; user-select:none; }
  .title-wrap { margin-top:6vh; text-align:center; animation:fadeIn 2.4s ease both; }
  .title {
    font-family:"Noto Serif SC","STKaiti","KaiTi","FangSong","Microsoft YaHei",serif;
    font-size:clamp(52px, 10vw, 120px);
    font-weight:700;
    letter-spacing:.14em; text-indent:.14em;
    background:linear-gradient(115deg,#ffe6ef 0%,#ffb3d1 28%,#ff5f8f 52%,#ff2d78 74%,#ffd166 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 16px rgba(255,77,150,.6)) drop-shadow(0 0 42px rgba(255,120,170,.35));
    animation:beat var(--beat,.83s) ease-in-out infinite;
  }
  .sub {
    margin-top:12px; font-size:clamp(13px,2vw,18px);
    letter-spacing:.5em; text-indent:.5em; color:#ffc9dd;
    text-shadow:0 0 12px rgba(255,120,170,.6);
  }
  .en {
    margin-top:8px; font-size:10px; letter-spacing:.42em; text-indent:.42em;
    color:rgba(255,210,235,.45); text-transform:uppercase;
  }
  .bottom {
    position:fixed; left:0; right:0; bottom:4.5vh; z-index:3;
    text-align:center; pointer-events:none;
    font-size:clamp(12px,1.8vw,16px); letter-spacing:.3em; text-indent:.3em;
    color:rgba(255,215,235,.72); text-shadow:0 0 14px rgba(255,120,170,.5);
    animation:fadeIn 3.2s ease both;
  }
  .hint {
    position:fixed; left:18px; bottom:14px; z-index:3;
    font-size:12px; color:rgba(255,210,230,.5); letter-spacing:1px; pointer-events:none;
  }
  .panel {
    position:fixed; top:16px; right:16px; z-index:4; user-select:none;
    background:rgba(30,15,55,.38); border:1px solid rgba(255,255,255,.14); border-radius:14px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    padding:14px 16px; display:flex; flex-direction:column; gap:12px;
    color:#ffd6e6; font-size:12px; letter-spacing:1px;
    box-shadow:0 8px 30px rgba(0,0,0,.35); animation:fadeIn 3s ease both;
  }
  .panel .row { display:flex; align-items:center; gap:8px; }
  .panel .row > span:first-child { width:30px; }
  .panel input[type=range] { width:110px; accent-color:#ff5f8f; cursor:pointer; }
  .panel input[type=checkbox] { width:16px; height:16px; accent-color:#ff5f8f; cursor:pointer; }
  .panel .val { min-width:28px; text-align:right; color:#ff9ec2; font-variant-numeric:tabular-nums; }
  .panel button {
    flex:1; padding:6px 0; border-radius:8px; cursor:pointer;
    border:1px solid rgba(255,140,180,.45);
    background:linear-gradient(135deg,rgba(255,77,166,.25),rgba(255,143,179,.12));
    color:#ffe0ec; font-size:12px; letter-spacing:2px; transition:all .2s;
  }
  .panel button:hover { background:rgba(255,77,166,.45); box-shadow:0 0 14px rgba(255,95,143,.55); transform:translateY(-1px); }
  .panel button:active { transform:translateY(0); }
  @keyframes beat {
    0%, 100% { transform:scale(1); }
    10% { transform:scale(1.09); }
    22% { transform:scale(1); }
    34% { transform:scale(1.06); }
    46% { transform:scale(1); }
  }
  @keyframes fadeIn {
    from { opacity:0; transform:translateY(10px); }
    to { opacity:1; transform:translateY(0); }
  }
  @media (max-width:640px) {
    .panel { transform:scale(.85); transform-origin:top right; animation:none; }
    .title-wrap { margin-top:8vh; }
  }
  @media (hover:none) { .hint { display:none; } }
</style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="vignette"></div>
  <div class="overlay">
    <div class="title-wrap">
      <h1 class="title">七夕节快乐</h1>
      <p class="sub">鹊 桥 相 会</p>
      <p class="en">Qixi Festival · Chinese Valentine's Day</p>
    </div>
  </div>
  <p class="bottom">愿天下有情人终成眷属</p>
  <div class="panel">
    <div class="row">
      <span>心跳</span>
      <input type="range" id="rateRange" min="10" max="150" value="30">
      <span class="val" id="rateVal">30</span>
    </div>
    <div class="row">
      <span>粒子</span>
      <input type="range" id="countRange" min="300" max="1400" step="100" value="800">
      <span class="val" id="countVal">800</span>
    </div>
    <div class="row">
      <span>自转</span>
      <input type="checkbox" id="spinToggle">
    </div>
    <div class="row">
      <button id="scatterBtn">散 开</button>
      <button id="reformBtn">重 聚</button>
    </div>
  </div>
  <p class="hint">🖱 移动拖出光尾 · 拖拽旋转 3D · 滚轮缩放 · 点击生成带字小爱心</p>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const DPR_CAP = 2;
  const TAU = Math.PI * 2;
  const PERSP = 34;   // 3D 透视焦距（世界单位）

  /* ---------- 调色板 & 辉光贴图 ---------- */
  const PALETTE = ['#ff2d78', '#ff5f8f', '#ff8fb3', '#ffb3d1', '#ff4da6', '#ffd166', '#c9a7ff'];
  const spriteCache = new Map();
  function glowSprite(hex) {
    let s = spriteCache.get(hex);
    if (s) return s;
    s = document.createElement('canvas');
    s.width = s.height = 64;
    const g = s.getContext('2d');
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255,255,255,0.95)');
    grad.addColorStop(0.22, hex);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    spriteCache.set(hex, s);
    return s;
  }
  function hexToRgba(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  let petalImg = null, petalReady = false;
  let petalSprites = [];
  function buildPetalVariants() {
    petalSprites = [];
    const w = petalImg.width, h = petalImg.height;
    // 先取原图像素，变体只改 RGB、保留原始 alpha，避免色块填充到透明背景
    const base = document.createElement('canvas');
    base.width = w; base.height = h;
    const bg = base.getContext('2d');
    bg.drawImage(petalImg, 0, 0);
    const baseData = bg.getImageData(0, 0, w, h);
    // 0 原版粉白 / 1 深粉 / 2 金粉 / 3 浅紫（RGB 缩放系数）
    const tints = [null, [1.0, 0.55, 0.62], [1.05, 0.88, 0.60], [0.92, 0.82, 1.08]];
    for (let i = 0; i < tints.length; i++) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const g = c.getContext('2d');
      if (!tints[i]) {
        g.drawImage(petalImg, 0, 0);
      } else {
        const t = tints[i];
        const d = g.createImageData(w, h);
        for (let p = 0; p < baseData.data.length; p += 4) {
          d.data[p] = Math.min(255, baseData.data[p] * t[0]);
          d.data[p + 1] = Math.min(255, baseData.data[p + 1] * t[1]);
          d.data[p + 2] = Math.min(255, baseData.data[p + 2] * t[2]);
          d.data[p + 3] = baseData.data[p + 3];
        }
        g.putImageData(d, 0, 0);
      }
      petalSprites.push(c);
    }
  }
  function loadPetal() {
    if (!PETAL_SRC || PETAL_SRC.charAt(0) === '_') return;
    const img = new Image();
    img.onload = () => {
      petalImg = img;
      buildPetalVariants();
      petalReady = true;
    };
    img.src = PETAL_SRC;
  }

  /* ---------- 全局状态 ---------- */
  let W = 0, H = 0, DPR = 1;
  let rate = 72 / 60;                 // 每秒心跳次数
  let heartS = 100, cx = 0, cy = 0;   // 心形单位缩放与中心
  let particles = [];
  let scattered = false;
  let stars = [], milkyDots = [], petals = [];
  let trail = [], clickHearts = [];
  let lastTrailX = 0, lastTrailY = 0, trailReady = false;
  let clickSeq = 0;
  const CLICK_CHARS = ['七', '夕', '节', '快', '乐'];
  let lastNow = 0;
  let shooting = null, nextShoot = 3;
  let lastLub = 0, lastDub = 0, lastScale = 1;
  const mouse = { x: -9999, y: -9999, active: false };

  // 3D 视图状态：偏航/俯仰/自转/缩放/拖拽
  let viewYaw = 0, viewPitch = 0.28, autoSpin = false, zoom = 1;
  let dragging = false, dragMoved = 0, lastMX = 0, lastMY = 0;
  let drawOrder = [];

  const gauss = (x, mu, s) => Math.exp(-Math.pow(x - mu, 2) / (2 * s * s));
  const rand = (a, b) => a + Math.random() * (b - a);

  /* ---------- 心形参数方程 ---------- */
  function heartPoint(t) {
    const st = Math.sin(t);
    return {
      x: 16 * st * st * st,
      y: 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
    };
  }

  /* ---------- 星空 / 银河 ---------- */
  function buildSky() {
    stars = [];
    const count = Math.max(80, Math.min(240, Math.round(W * H / 9000)));
    for (let i = 0; i < count; i++) {
      const big = Math.random() < 0.08;
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: big ? rand(1.3, 2.0) : rand(0.4, 1.2),
        base: rand(0.25, 0.9),
        speed: rand(0.4, 2.2),
        phase: rand(0, TAU),
        cross: big && Math.random() < 0.5,
        color: Math.random() < 0.85 ? '#dfe6ff' : '#ffe9c9'
      });
    }
    milkyDots = [];
    const L = Math.hypot(W, H) * 0.75;
    const bw = Math.min(W, H) * 0.62;
    for (let i = 0; i < 240; i++) {
      let off = 0;
      for (let k = 0; k < 3; k++) off += Math.random();
      off = ((off / 3) - 0.5) * 2;   // 近似高斯分布，向带心集中
      milkyDots.push({
        s: rand(-L, L),
        off: off * bw * 0.42,
        r: rand(0.4, 1.4),
        a: rand(0.04, 0.16),
        ph: rand(0, TAU),
        color: Math.random() < 0.7 ? '#c9d4ff' : '#ffe2c4'
      });
    }
  }

  function drawMilkyWay(time) {
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(-0.2);
    const L = Math.hypot(W, H) * 0.75;
    const bw = Math.min(W, H) * 0.62;
    ctx.globalCompositeOperation = 'screen';
    const g = ctx.createLinearGradient(0, -bw / 2, 0, bw / 2);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.18, 'rgba(150,130,255,0.05)');
    g.addColorStop(0.5, 'rgba(220,210,255,0.09)');
    g.addColorStop(0.82, 'rgba(150,130,255,0.05)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(-L, -bw / 2, L * 2, bw);
    ctx.globalCompositeOperation = 'lighter';
    for (const d of milkyDots) {
      ctx.globalAlpha = d.a * (0.7 + 0.3 * Math.sin(time * 1.2 + d.ph));
      ctx.fillStyle = d.color;
      ctx.beginPath();
      ctx.arc(d.s, d.off, d.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawStars(time) {
    for (const s of stars) {
      const a = s.base * (0.55 + 0.45 * Math.sin(time * s.speed + s.phase));
      ctx.globalAlpha = Math.max(0.05, a);
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fill();
      if (s.cross) {
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(s.x - s.r * 2.6, s.y);
        ctx.lineTo(s.x + s.r * 2.6, s.y);
        ctx.moveTo(s.x, s.y - s.r * 2.6);
        ctx.lineTo(s.x, s.y + s.r * 2.6);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- 流星 ---------- */
  function spawnShooting() {
    const x0 = rand(W * 0.1, W * 0.9);
    const y0 = rand(0, H * 0.35);
    const ang = rand(Math.PI * 0.15, Math.PI * 0.5);
    const len = rand(W * 0.25, W * 0.45);
    return { x0, y0, dx: Math.cos(ang) * len, dy: Math.sin(ang) * len, t0: 0, dur: rand(0.7, 1.1) };
  }
  function drawShooting(time) {
    if (!shooting) {
      if (time >= nextShoot) shooting = Object.assign(spawnShooting(), { t0: time });
      return;
    }
    const pr = (time - shooting.t0) / shooting.dur;
    if (pr >= 1) {
      shooting = null;
      nextShoot = time + rand(5, 14);
      return;
    }
    const x = shooting.x0 + shooting.dx * pr;
    const y = shooting.y0 + shooting.dy * pr;
    const len = 150 * (0.3 + 0.7 * pr);
    const ang = Math.atan2(shooting.dy, shooting.dx);
    const g = ctx.createLinearGradient(x, y, x - Math.cos(ang) * len, y - Math.sin(ang) * len);
    g.addColorStop(0, 'rgba(255,255,255,0.85)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = g;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - Math.cos(ang) * len, y - Math.sin(ang) * len);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(x, y, 1.8, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- 牛郎 & 织女 ---------- */
  function drawFlare(st, time, phase) {
    const pulse = 0.6 + 0.4 * Math.sin(time * 1.7 + phase);
    ctx.globalCompositeOperation = 'lighter';
    const halo = ctx.createRadialGradient(st.x, st.y, 0, st.x, st.y, st.r * 10);
    halo.addColorStop(0, hexToRgba(st.c, 0.55 * pulse));
    halo.addColorStop(0.25, hexToRgba(st.c, 0.18 * pulse));
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.r * 10, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.r * 0.9, 0, TAU);
    ctx.fill();
    ctx.save();
    ctx.translate(st.x, st.y);
    ctx.rotate(time * 0.06 + phase);
    const ray = (len, w, a) => {
      const g = ctx.createLinearGradient(-len, 0, len, 0);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(0.5, hexToRgba(st.c, a * pulse));
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = w;
      ctx.beginPath();
      ctx.moveTo(-len, 0);
      ctx.lineTo(len, 0);
      ctx.stroke();
    };
    ray(st.r * 9, 1.4, 0.85);
    ctx.rotate(Math.PI / 2);
    ray(st.r * 9, 1.4, 0.85);
    ctx.rotate(Math.PI / 4);
    ray(st.r * 4, 1.0, 0.6);
    ctx.rotate(Math.PI / 2);
    ray(st.r * 4, 1.0, 0.6);
    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
  }
  function drawCelestial(time) {
    const v = { x: W * 0.22, y: H * 0.20, r: Math.max(2.2, Math.min(W, H) * 0.004), c: '#9fd4ff' };
    const a = { x: W * 0.78, y: H * 0.34, r: Math.max(2.2, Math.min(W, H) * 0.004), c: '#ffe3a1' };
    drawFlare(v, time, 0);
    drawFlare(a, time, 2.4);
    ctx.font = '12px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(220,235,255,0.6)';
    ctx.fillText('织女', v.x + 22, v.y + 32);
    ctx.fillStyle = 'rgba(255,235,200,0.6)';
    ctx.fillText('牛郎', a.x - 50, a.y - 18);
  }

  /* ---------- 鹊桥 ---------- */
  function birdPath(x, y, s, flap) {
    ctx.beginPath();
    ctx.moveTo(x - 9 * s, y + 2 * s);
    ctx.quadraticCurveTo(x - 6 * s, y - (6 + flap * 4) * s, x - 2 * s, y + s);
    ctx.quadraticCurveTo(x, y - (1 + flap * 2) * s, x + 2 * s, y + s);
    ctx.quadraticCurveTo(x + 6 * s, y - (6 + flap * 4) * s, x + 9 * s, y + 2 * s);
  }
  function drawBird(x, y, s, flap, alpha) {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(190,170,255,' + (0.35 * alpha).toFixed(3) + ')';
    ctx.lineWidth = 3.2 * s;
    birdPath(x, y, s, flap);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(28,18,58,' + (0.85 * alpha).toFixed(3) + ')';
    ctx.lineWidth = 1.5 * s;
    birdPath(x, y, s, flap);
    ctx.stroke();
  }
  function drawBridge(time) {
    const cycle = 20, active = 15;
    const ct = time % cycle;
    let alpha = 0;
    if (ct < active) alpha = Math.min(1, ct / 2, (active - ct) / 2);
    if (alpha <= 0.01) return;
    const vx = W * 0.22, vy = H * 0.20;
    const ax = W * 0.78, ay = H * 0.34;
    const mcx = (vx + ax) / 2;
    const mcy = Math.min(vy, ay) - Math.min(W, H) * 0.16;
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createLinearGradient(vx, vy, ax, ay);
    g.addColorStop(0, 'rgba(160,200,255,0)');
    g.addColorStop(0.5, 'rgba(190,170,255,' + (0.22 * alpha).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,220,170,0)');
    ctx.strokeStyle = g;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(vx, vy);
    ctx.quadraticCurveTo(mcx, mcy, ax, ay);
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
    const n = 11;
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const bx = (1 - t) * (1 - t) * vx + 2 * (1 - t) * t * mcx + t * t * ax;
      const by = (1 - t) * (1 - t) * vy + 2 * (1 - t) * t * mcy + t * t * ay;
      const bob = Math.sin(time * 1.8 + i * 0.9) * 4;
      const flap = Math.sin(time * 7 + i * 1.3);
      const s = Math.max(0.5, Math.min(W, H) / 1000);
      drawBird(bx, by + bob, s, flap, alpha);
    }
    if (alpha > 0.4) {
      const midX = (vx + 2 * mcx + ax) / 4;
      const midY = (vy + 2 * mcy + ay) / 4;
      ctx.font = '12px "Microsoft YaHei","PingFang SC",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(225,215,255,' + (0.7 * alpha).toFixed(3) + ')';
      ctx.fillText('鹊桥', midX, midY - 16);
    }
  }

  /* ---------- 漂浮花瓣 ---------- */
  function newPetal(top) {
    return {
      x: rand(0, W),
      y: top ? rand(0, H) : H + 20,
      vy: -(0.25 + Math.random() * 0.5) * Math.max(0.8, H / 800),
      phase: rand(0, TAU),
      size: rand(3, 6.5),
      rot: rand(0, TAU),
      vr: rand(-0.02, 0.02),
      color: Math.random() < 0.7 ? 0 : 1 + Math.floor(rand(0, 3)),
      alpha: rand(0.4, 0.75),
      flip: Math.random() < 0.5
    };
  }
  function buildPetals() {
    petals = [];
    const n = Math.max(8, Math.round(Math.min(W, H) / 70));
    for (let i = 0; i < n; i++) petals.push(newPetal(true));
  }
  function drawPetals(time) {
    ctx.globalCompositeOperation = 'lighter';
    for (const p of petals) {
      p.y += p.vy;
      p.rot += p.vr;
      p.x += Math.sin(time * 0.7 + p.phase) * 0.35;
      if (p.y < -30) {
        const np = newPetal(false);
        p.x = np.x; p.y = np.y; p.phase = np.phase; p.size = np.size;
        p.rot = np.rot; p.vr = np.vr; p.color = np.color; p.alpha = np.alpha; p.vy = np.vy;
        p.flip = np.flip;
      }
      if (petalReady) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot + Math.sin(time * 0.8 + p.phase) * 0.35);
        if (p.flip) ctx.scale(-1, 1);
        ctx.globalAlpha = p.alpha;
        const spr = petalSprites[p.color];
        const d = p.size * 5;
        ctx.drawImage(spr, -d / 2, -d / 2, d, d);
        ctx.restore();
      } else {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.scale(1, 1.6);
        ctx.globalAlpha = p.alpha * 0.7;
        const spr = glowSprite(PALETTE[p.color]);
        const d = p.size * 2.6;
        ctx.drawImage(spr, -d / 2, -d / 2, d, d);
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- 粒子爱心 ---------- */
  function buildParticles(count, assemble) {
    particles = [];
    for (let i = 0; i < count; i++) {
      const t = Math.random() * TAU;
      const hp = heartPoint(t);
      const edge = Math.random() < 0.30;
      const r = edge ? rand(0.8, 1.0) : Math.pow(Math.random(), 1.05);
      const j = edge ? 0.05 : 0.14;
      const hx = hp.x * r + rand(-j, j);
      const hy = hp.y * r + rand(-j, j);
      // 3D 透镜剖面：中心厚、边缘薄，构成立体心形
      const zMax = 8 * Math.sqrt(Math.max(0, 1 - r * r));
      const hz = rand(-zMax, zMax);
      const ci = Math.random() < 0.55
        ? Math.floor(rand(0, 5))
        : 5 + Math.floor(rand(0, 2));
      particles.push({
        hx, hy, hz,
        x: assemble ? rand(-28, 28) : hx,
        y: assemble ? rand(-28, 28) : hy,
        z: assemble ? rand(-12, 12) : hz,
        vx: 0, vy: 0, vz: 0,
        size: edge ? rand(2.0, 4.0) : rand(1.0, 2.6),
        color: ci,
        tw: rand(0, TAU),
        wx: 0, wy: 0, wz: 0,
        rot: rand(0, TAU),
        rotSp: rand(-0.25, 0.25),
        flt: rand(0, TAU),
        petal: Math.random() < 0.72 ? 0 : 1 + Math.floor(rand(0, 3)),
        flip: Math.random() < 0.5,
        sx: 0, sy: 0, ss: 1, zc: 0
      });
    }
  }

  function update(time, dt) {
    const period = 1 / rate;
    const ph = (time / period) % 1;
    const lub = gauss(ph, 0.12, 0.035);   // 第一跳（lub）
    const dub = gauss(ph, 0.38, 0.05);    // 第二跳（dub）
    lastLub = lub; lastDub = dub;
    const breath = 0.02 * Math.sin(time * 0.9);
    const scale = 1 + 0.10 * lub + 0.075 * dub + breath;
    lastScale = scale;
    const sway = Math.sin(time * 0.5) * 0.06;   // 轻微左右摆动
    const cw = Math.cos(sway), sw = Math.sin(sway);
    const stiff = scattered ? 0.035 : 0.10;
    const damp = 0.88;
    const zs = heartS * zoom;
    const Rw = 150 / zs, Rw2 = Rw * Rw;
    const cya = Math.cos(viewYaw), sya = Math.sin(viewYaw);
    const cpi = Math.cos(viewPitch), spi = Math.sin(viewPitch);

    for (const p of particles) {
      let tx, ty, tz;
      if (scattered) {
        if (Math.random() < 0.0015) {
          p.wx = Math.max(-24, Math.min(24, p.wx + rand(-3, 3)));
          p.wy = Math.max(-24, Math.min(24, p.wy + rand(-3, 3)));
          p.wz = Math.max(-10, Math.min(10, p.wz + rand(-1.5, 1.5)));
        }
        tx = p.wx; ty = p.wy; tz = p.wz;
      } else {
        const hxr = p.hx * cw + p.hz * sw;
        const hzr = -p.hx * sw + p.hz * cw;
        tx = hxr * scale; ty = p.hy * scale; tz = hzr * scale;
      }
      let ax = (tx - p.x) * stiff;
      let ay = (ty - p.y) * stiff;
      let az = (tz - p.z) * stiff;
      if (mouse.active && !scattered) {
        const mwx = (mouse.x - cx) / zs;
        const mwy = (cy - mouse.y) / zs;
        const dx = p.x - mwx, dy = p.y - mwy;
        const d2 = dx * dx + dy * dy;
        if (d2 < Rw2) {
          const d = Math.sqrt(d2) || 1;
          const f = (1 - d / Rw) * 0.12;
          ax -= (dx / d) * f;
          ay -= (dy / d) * f;
        }
      }
      p.vx = (p.vx + ax) * damp;
      p.vy = (p.vy + ay) * damp;
      p.vz = (p.vz + az) * damp;
      p.x += p.vx;
      p.y += p.vy;
      p.z += p.vz;
      // 3D 旋转（Y 偏航 + X 俯仰）与透视投影
      const x1 = p.x * cya + p.z * sya;
      const z1 = -p.x * sya + p.z * cya;
      const y2 = p.y * cpi - z1 * spi;
      const z2 = p.y * spi + z1 * cpi;
      const s = Math.min(2.2, PERSP / (PERSP - z2));
      p.sx = cx + x1 * zs * s;
      p.sy = cy - y2 * zs * s;
      p.ss = s;
      p.zc = z2;
    }
    // 画家算法：按深度从远到近排序
    if (drawOrder.length !== particles.length) {
      drawOrder = [];
      for (let i = 0; i < particles.length; i++) drawOrder.push(i);
    }
    drawOrder.sort((a, b) => particles[a].zc - particles[b].zc);
    if (autoSpin) viewYaw += dt * 0.45;
  }

  function drawHeartHalo() {
    const pulse = lastLub + lastDub * 0.8;
    const R = heartS * 26 * lastScale;
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(cx, cy - heartS * 6, 0, cx, cy - heartS * 6, R);
    g.addColorStop(0, 'rgba(255,90,150,' + (0.10 + 0.10 * pulse).toFixed(3) + ')');
    g.addColorStop(0.4, 'rgba(255,80,150,' + (0.05 + 0.05 * pulse).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy - heartS * 6, R, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawParticles(time) {
    if (petalReady) {
      // 花瓣底层微光（按深度排序 + 远近明暗）
      ctx.globalCompositeOperation = 'lighter';
      for (const i of drawOrder) {
        const p = particles[i];
        const tw = 0.5 + 0.4 * Math.sin(time * 2.6 + p.tw);
        ctx.globalAlpha = Math.max(0.1, tw) * 0.5 * (0.6 + 0.4 * Math.min(1.15, p.ss));
        const spr = glowSprite(PALETTE[p.color]);
        const d = p.size * 4 * p.ss;
        ctx.drawImage(spr, p.sx - d / 2, p.sy - d / 2, d, d);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      // 桃花花瓣渲染：透视缩放 + 远近雾化 + 随机朝向翻飞
      for (const i of drawOrder) {
        const p = particles[i];
        const a = (0.86 + 0.14 * Math.sin(time * 2.2 + p.flt)) * (0.55 + 0.45 * Math.min(1.2, p.ss));
        const rot = p.rot + Math.sin(time * 1.4 + p.flt) * 0.4 + time * p.rotSp;
        const d = p.size * 7 * p.ss;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.translate(p.sx, p.sy);
        ctx.rotate(rot);
        if (p.flip) ctx.scale(-1, 1);
        ctx.drawImage(petalSprites[p.petal], -d / 2, -d / 2, d, d);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      return;
    }
    // 贴图未就绪时的回退：发光圆点（同样带 3D 投影与深度排序）
    ctx.globalCompositeOperation = 'lighter';
    for (const i of drawOrder) {
      const p = particles[i];
      const tw = 0.5 + 0.4 * Math.sin(time * 2.6 + p.tw);
      ctx.globalAlpha = Math.max(0.15, tw);
      const spr = glowSprite(PALETTE[p.color]);
      const d = p.size * 5.4 * p.ss;
      ctx.drawImage(spr, p.sx - d / 2, p.sy - d / 2, d, d);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    for (const i of drawOrder) {
      const p = particles[i];
      ctx.fillStyle = PALETTE[p.color];
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, Math.max(0.5, p.size * 0.5 * p.ss), 0, TAU);
      ctx.fill();
    }
  }

  /* ---------- 鼠标尾随粒子 ---------- */
  function spawnTrail(x, y) {
    trail.push({
      x, y,
      vx: rand(-0.5, 0.5),
      vy: rand(-0.4, 0.7),
      size: rand(0.8, 2.2),
      color: Math.random() < 0.6 ? Math.floor(rand(0, 5)) : 5,
      life: 0,
      max: rand(0.35, 0.85)
    });
  }
  function updateTrail(dt) {
    for (let i = trail.length - 1; i >= 0; i--) {
      const p = trail[i];
      p.life += dt;
      if (p.life >= p.max) { trail.splice(i, 1); continue; }
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.95;
      p.vy *= 0.95;
    }
    if (trail.length > 240) trail.splice(0, trail.length - 240);
  }
  function drawTrail() {
    if (!trail.length) return;
    ctx.globalCompositeOperation = 'lighter';
    for (const p of trail) {
      const k = 1 - p.life / p.max;
      ctx.globalAlpha = Math.max(0, k) * 0.75;
      const spr = glowSprite(PALETTE[p.color]);
      const d = p.size * 4.5;
      ctx.drawImage(spr, p.x - d / 2, p.y - d / 2, d, d);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- 点击生成带字小爱心 ---------- */
  function spawnClickHeart(x, y) {
    const ms = Math.max(2.2, Math.min(heartS * 0.3, 9));
    const ch = CLICK_CHARS[clickSeq % CLICK_CHARS.length];
    clickSeq++;
    const pts = [];
    const n = 48;
    for (let i = 0; i < n; i++) {
      const t = Math.random() * TAU;
      const hp = heartPoint(t);
      const edge = Math.random() < 0.5;
      const r = edge ? rand(0.75, 1.0) : Math.pow(Math.random(), 0.8);
      const j = 0.05;
      const ang = rand(0, TAU), dist = rand(30, 90);
      pts.push({
        hx: hp.x * r + rand(-j, j),
        hy: hp.y * r + rand(-j, j),
        x: x + Math.cos(ang) * dist,
        y: y + Math.sin(ang) * dist,
        vx: 0, vy: 0,
        size: edge ? rand(1.6, 2.6) : rand(0.9, 1.8),
        color: Math.random() < 0.6 ? Math.floor(rand(0, 5)) : 5 + Math.floor(rand(0, 2)),
        tw: rand(0, TAU),
        rot: rand(0, TAU),
        flt: rand(0, TAU),
        petal: Math.random() < 0.7 ? 0 : 1 + Math.floor(rand(0, 3)),
        flip: Math.random() < 0.5
      });
    }
    clickHearts.push({ x, y, ms, ch, t: 0, dur: 2.2, alpha: 1, yOff: 0, grow: 1, pts });
    if (clickHearts.length > 12) clickHearts.shift();
  }
  function updateClickHearts(dt) {
    for (let i = clickHearts.length - 1; i >= 0; i--) {
      const h = clickHearts[i];
      h.t += dt;
      if (h.t >= h.dur) { clickHearts.splice(i, 1); continue; }
      const rise = Math.max(0, (h.t - h.dur * 0.35) / (h.dur * 0.65));
      h.alpha = Math.max(0, 1 - rise);
      h.yOff = rise * 46;
      h.grow = 1 + rise * 0.45;
      const stiff = 0.22, damp = 0.82;
      for (const p of h.pts) {
        const tx = h.x + p.hx * h.ms * h.grow;
        const ty = h.y - h.yOff - p.hy * h.ms * h.grow;
        p.vx = (p.vx + (tx - p.x) * stiff) * damp;
        p.vy = (p.vy + (ty - p.y) * stiff) * damp;
        p.x += p.vx;
        p.y += p.vy;
      }
    }
  }
  function drawClickHearts(time) {
    if (!clickHearts.length) return;
    ctx.globalCompositeOperation = 'lighter';
    for (const h of clickHearts) {
      for (const p of h.pts) {
        const tw = 0.5 + 0.4 * Math.sin(time * 3 + p.tw);
        ctx.globalAlpha = Math.max(0.12, tw) * h.alpha;
        const spr = glowSprite(PALETTE[p.color]);
        const d = p.size * 4.6;
        ctx.drawImage(spr, p.x - d / 2, p.y - d / 2, d, d);
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    for (const h of clickHearts) {
      for (const p of h.pts) {
        if (petalReady) {
          ctx.save();
          ctx.globalAlpha = h.alpha * (0.85 + 0.15 * Math.sin(time * 3 + p.flt));
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot + Math.sin(time * 2.5 + p.flt) * 0.35);
          if (p.flip) ctx.scale(-1, 1);
          const d = p.size * 5.6;
          ctx.drawImage(petalSprites[p.petal], -d / 2, -d / 2, d, d);
          ctx.restore();
        } else {
          ctx.globalAlpha = h.alpha;
          ctx.fillStyle = PALETTE[p.color];
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(0.4, p.size * 0.4), 0, TAU);
          ctx.fill();
        }
      }
    }
    ctx.globalAlpha = 1;
    for (const h of clickHearts) {
      const fs = h.ms * 11;
      const tx = h.x;
      const ty = h.y - h.yOff + h.ms * 2;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '600 ' + fs + 'px "STKaiti","KaiTi","Microsoft YaHei",serif';
      ctx.shadowColor = 'rgba(122,12,54,0.85)';
      ctx.shadowBlur = 15 * h.alpha;
      ctx.fillStyle = 'rgba(255,240,248,' + h.alpha.toFixed(3) + ')';
      ctx.fillText(h.ch, tx, ty);
      ctx.restore();
    }
  }

  /* ---------- 主循环 ---------- */
  function draw(time) {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0b0420');
    bg.addColorStop(0.5, '#170a33');
    bg.addColorStop(1, '#2a0f3f');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    drawMilkyWay(time);
    drawStars(time);
    drawShooting(time);
    drawHeartHalo();
    drawCelestial(time);
    drawBridge(time);
    drawPetals(time);
    drawParticles(time);
    drawTrail();
    drawClickHearts(time);
  }
  function frame(now) {
    const time = now / 1000;
    const dt = Math.min(0.05, lastNow ? (now - lastNow) / 1000 : 0.016);
    lastNow = now;
    update(time, dt);
    updateTrail(dt);
    updateClickHearts(dt);
    draw(time);
    requestAnimationFrame(frame);
  }

  /* ---------- 尺寸 ---------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W * 0.5;
    cy = H * 0.60;
    heartS = Math.min(W, H) * 0.019;
    buildSky();
    buildPetals();
  }

  /* ---------- 交互 ---------- */
  function burstAt(x, y) {
    const zs = heartS * zoom;
    const wcx = (x - cx) / zs;
    const wcy = (cy - y) / zs;
    for (const p of particles) {
      const dx = p.x - wcx, dy = p.y - wcy, dz = p.z;
      const d = Math.hypot(dx, dy, dz) || 1;
      if (d < 16) {
        const f = (1 - d / 16) * rand(0.5, 1.1);
        p.vx += (dx / d) * f;
        p.vy += (dy / d) * f;
        p.vz += (dz / d) * f * 0.7;
      }
    }
  }

  const rateRange = document.getElementById('rateRange');
  const rateVal = document.getElementById('rateVal');
  const countRange = document.getElementById('countRange');
  const countVal = document.getElementById('countVal');
  const scatterBtn = document.getElementById('scatterBtn');
  const reformBtn = document.getElementById('reformBtn');

  function setRate(v) {
    rate = v / 60;
    document.documentElement.style.setProperty('--beat', (60 / v).toFixed(2) + 's');
  }
  rateRange.addEventListener('input', () => {
    rateVal.textContent = rateRange.value;
    setRate(+rateRange.value);
  });
  countRange.addEventListener('input', () => {
    countVal.textContent = countRange.value;
  });
  countRange.addEventListener('change', () => {
    buildParticles(+countRange.value, false);
  });
  scatterBtn.addEventListener('click', () => {
    scattered = true;
    for (const p of particles) {
      const ang = rand(0, TAU), dist = rand(8, 22);
      p.wx = p.x + Math.cos(ang) * dist;
      p.wy = p.y + Math.sin(ang) * dist;
      p.wz = p.z + rand(-5, 5);
    }
  });
  reformBtn.addEventListener('click', () => { scattered = false; });

  const spinToggle = document.getElementById('spinToggle');
  spinToggle.addEventListener('change', () => { autoSpin = spinToggle.checked; });

  canvas.addEventListener('mousemove', (e) => {
    if (dragging) { mouse.active = false; return; }
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
    if (!trailReady) {
      lastTrailX = e.clientX;
      lastTrailY = e.clientY;
      trailReady = true;
    }
    const dx = e.clientX - lastTrailX, dy = e.clientY - lastTrailY;
    if (dx * dx + dy * dy > 90) {
      lastTrailX = e.clientX;
      lastTrailY = e.clientY;
      spawnTrail(e.clientX, e.clientY);
    }
  });
  canvas.addEventListener('mouseleave', () => { mouse.active = false; });
  canvas.addEventListener('mousedown', (e) => {
    dragging = true;
    dragMoved = 0;
    lastMX = e.clientX;
    lastMY = e.clientY;
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastMX, dy = e.clientY - lastMY;
    lastMX = e.clientX;
    lastMY = e.clientY;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    viewYaw += dx * 0.005;
    viewPitch = Math.max(-0.9, Math.min(0.9, viewPitch + dy * 0.005));
  });
  window.addEventListener('mouseup', (e) => {
    if (dragging && dragMoved < 7) {
      burstAt(e.clientX, e.clientY);
      spawnClickHeart(e.clientX, e.clientY);
    }
    dragging = false;
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoom = Math.max(0.6, Math.min(1.8, zoom * (e.deltaY < 0 ? 1.08 : 0.92)));
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    if (!e.touches.length || !dragging) return;
    const dx = e.touches[0].clientX - lastMX;
    const dy = e.touches[0].clientY - lastMY;
    lastMX = e.touches[0].clientX;
    lastMY = e.touches[0].clientY;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    viewYaw += dx * 0.005;
    viewPitch = Math.max(-0.9, Math.min(0.9, viewPitch + dy * 0.005));
  }, { passive: true });
  canvas.addEventListener('touchend', (e) => {
    if (dragging && dragMoved < 7 && e.changedTouches.length) {
      const t = e.changedTouches[0];
      burstAt(t.clientX, t.clientY);
      spawnClickHeart(t.clientX, t.clientY);
    }
    dragging = false;
    mouse.active = false;
  }, { passive: true });
  canvas.addEventListener('touchstart', (e) => {
    if (!e.touches.length) return;
    dragging = true;
    dragMoved = 0;
    lastMX = e.touches[0].clientX;
    lastMY = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('resize', () => {
    resize();
    buildParticles(particles.length, false);
  });

  loadPetal();
  resize();
  buildParticles(800, true);
  setRate(+rateRange.value);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
